<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="header">
    <h1>Auto Reply Dashboard</h1>
    <div class="mode-toggle">
      <span class="mode-label">Mode:</span>
      <button id="mode-btn" class="mode-btn">Loading...</button>
    </div>
  </div>
  <div class="grid">
    <section>
      <h2>Pending Drafts</h2>
      <div id="drafts">Loading...</div>
    </section>
    <section>
      <h2>Scheduled Sends</h2>
      <div id="scheduled">Loading...</div>
    </section>
    <section>
      <h2>Template Suggestions</h2>
      <div id="suggestions">Loading...</div>
    </section>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
